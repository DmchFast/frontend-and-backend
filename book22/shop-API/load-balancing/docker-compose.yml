version: "3.8"

services:
  backend1:
    build: ./backend
    environment:
      - PORT=3000
    ports:
      - "3000:3000"

  backend2:
    build: ./backend
    environment:
      - PORT=3002
    ports:
      - "3002:3000"

  backend3:  # резервный
    build: ./backend
    environment:
      - PORT=3003
    ports:
      - "3003:3000"

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend1
      - backend2
      - backend3